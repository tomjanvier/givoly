name: Givoly CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JS syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Gettext check
        run: msgfmt --check -o /dev/null languages/givoly-fr_FR.po

      - name: Regression tests (lightweight, no WordPress/MySQL)
        run: php tests/run.php
